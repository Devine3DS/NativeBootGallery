name: Deploy gallery to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate gallery and files
        run: python3 scripts/verify.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Stage public site only
        run: |
          mkdir _site
          cp index.html style.css gallery.js favicon.svg catalog.json SHA256SUMS.txt README.md NOTICE.md LICENSE .nojekyll _site/
          cp -R downloads images media _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
